# FireClock — Nginx config
# Serves the static frontend AND proxies the .ics calendar feeds under
# same-origin paths (/cal/N) so the browser never hits CORS.
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent';
  access_log /dev/stdout main;
  error_log /dev/stderr warn;

  server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Static frontend ----
    location = / { try_files /index.html =404; }

    # Long client cache for static assets.
    location ~* \.(css|js)$ {
      expires 1h;
      add_header Cache-Control "public";
    }

    # ---- Calendar proxies (same-origin -> no CORS) ----
    location = /cal/0 {
      proxy_pass https://ics.armssoftware.com/production/ics/eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiJ9.eyJhcm1zX3VzZXIiOjEzNjg3MjgsImNhbGVuZGFyX3ZpZXdfaWQiOiIxOTAwMSIsImlhdCI6MTc3NTUwMDkzOX0.0jjtP-seyjZPU54NvM0SKvNFetHDaRCsUawrP7Nk7IbSaSJfSR7Re4IbsZ8CZ13rbFVnLJPEhoFLRKIj1XMXhQ;
      proxy_set_header Host $proxy_host;
      proxy_set_header Accept text/calendar;
    }

    location = /cal/1 {
      proxy_pass https://firebasestorage.googleapis.com/v0/b/rqp-5-0-0-calendars/o/WYEdtb0n4t7E6hFTrThR%2F850a60a5-28d6-4b74-87b5-e8038de994c2-FvVlOmbYzjfM5VYsbLF2CrJGfsA3.ics?alt=media&token=0abf57c0-d5b5-40ae-ba77-4481ccd6715d;
      proxy_set_header Host $proxy_host;
      proxy_set_header Accept text/calendar;
    }

    location = /cal/2 {
      proxy_pass https://calendar.google.com/calendar/ical/despotlucas%40gmail.com/public/basic.ics;
      proxy_set_header Host $proxy_host;
      proxy_set_header Accept text/calendar;
    }

    location = /cal/3 {
      proxy_pass https://calendar.google.com/calendar/ical/23pchloe%40gmail.com/public/basic.ics;
      proxy_set_header Host $proxy_host;
      proxy_set_header Accept text/calendar;
    }

    location = /news {
      proxy_pass https://feeds.npr.org/1001/rss.xml;
      proxy_ssl_server_name on;
      proxy_set_header Host feeds.npr.org;
      proxy_set_header Accept "application/rss+xml, application/xml, text/xml, */*";
      proxy_buffering off;
      add_header Access-Control-Allow-Origin *;
    }

    location = /weather {
      set $wx_lat $arg_lat;
      set $wx_lon $arg_lon;
      if ($wx_lat = "") { set $wx_lat "42.99"; }
      if ($wx_lon = "") { set $wx_lon "-71.48"; }
      proxy_pass "https://api.open-meteo.com/v1/forecast?latitude=$wx_lat&longitude=$wx_lon&current=temperature_2m,weather_code,apparent_temperature&hourly=precipitation_probability&daily=temperature_2m_max,temperature_2m_min,sunrise,sunset&temperature_unit=fahrenheit&precipitation_unit=inch&wind_speed_unit=mph&timezone=auto&forecast_days=1";
      proxy_ssl_server_name on;
      proxy_set_header Host api.open-meteo.com;
      proxy_set_header Accept application/json;
      proxy_buffering off;
      add_header Access-Control-Allow-Origin *;
    }

    location /api/ {
      proxy_pass http://fireclock-api:8787/;
      proxy_set_header Host $host;
      proxy_set_header Content-Type application/json;
      client_max_body_size 1m;
    }

    # Everything else -> frontend (SPA-ish entry point).
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}