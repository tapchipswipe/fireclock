name: Build and Release FireClock APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0

      - name: Build release APK
        run: gradle assembleRelease

      - name: Generate signing keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias fireclock \
            -storepass android -keypass android \
            -dname "CN=FireClock, OU=Dev, O=TapChipSwipe, L=Manchester, S=NH, C=US"

      - name: Sign APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.jks \
            --ks-key-alias fireclock \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify signed APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify \
            --verbose app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fireclock-apk
          path: app/build/outputs/apk/release/app-release-signed.apk

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: FireClock Latest
          files: app/build/outputs/apk/release/app-release-signed.apk
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
